# بناء تطبيق متاجر أحد للآيفون على Codemagic (ماك سحابي، الخطة المجانية ٥٠٠ دقيقة بالشهر).
# البدء يدوي من لوحة Codemagic: اختر الفرع mobile-app ثم الـ workflow.
# ما فيه أي سر بهالملف: مفتاح App Store Connect يندخل في Codemagic نفسه
# (Team settings ← Integrations ← Developer Portal ← Manage keys)، والتوقيع يُدار هناك.
workflows:
  # ١) فحص البناء بس (محاكي، بدون توقيع ولا حساب آبل)
  ios-check:
    name: iOS build check (simulator)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: latest
      node: 22
    scripts:
      - name: Xcode version
        script: xcodebuild -version
      - name: npm ci + cap sync
        script: |
          cd mobile
          npm ci
          npm run sync
      - name: xcodebuild (simulator, unsigned)
        script: |
          set -o pipefail
          cd mobile/ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -n 200

  # ٢) بناء موقّع ورفع لـ TestFlight (يحتاج حساب آبل مفعّل + مفتاح App Store Connect مربوط في Codemagic باسم ohod)
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    # يدوي فقط (تطبيق غلاف الموقع القديم). التطبيق الأصلي له workflows تحت.
    integrations:
      app_store_connect: ohod
    environment:
      xcode: latest
      node: 22
      ios_signing:
        distribution_type: app_store
        bundle_identifier: sa.ohod.store
    scripts:
      - name: npm ci + cap sync
        script: |
          cd mobile
          npm ci
          npm run sync
      - name: Use signing profiles
        script: xcode-project use-profiles --project mobile/ios/App/App.xcodeproj
      - name: Build number
        script: |
          cd mobile/ios/App
          agvtool new-version -all $((BUILD_NUMBER + 1))
      - name: Build ipa
        script: |
          xcode-project build-ipa --project mobile/ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false   # التجربة الداخلية (المالك وفريقه) ما تحتاج مراجعة؛ النسخة تظهر في TestFlight بعد ما تعالجها آبل

  # ٣) التطبيق الأصلي (SwiftUI): معاينة على المحاكي + صور الشاشات (بدون توقيع). يشتغل مع كل دفعة تلمس mobile/ios-native
  ios-native-preview:
    name: iOS Native Preview (simulator screenshots)
    instance_type: mac_mini_m2
    max_build_duration: 45
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: mobile-app
          include: true
          source: true
      cancel_previous_builds: true
    when:
      changeset:
        includes:
          - 'mobile/ios-native/'
        excludes:
          - 'mobile/ios-native/design/'
          - 'mobile/ios-native/research/'
          - 'mobile/ios-native/fastlane/'
          - 'mobile/ios-native/scripts/'
          - '**/*.md'
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Build for simulator + screenshots
        script: OUT="$CM_BUILD_DIR/screenshots" mobile/ios-native/scripts/preview-screens.sh
    artifacts:
      - screenshots/*.png
      - screenshots/build.log

  # ٥) صور المتجر (App Store): نفس شاشات المعاينة على آيفون Pro Max (مقاس ٦٫٩). يدوي من Codemagic أو الـ API
  ios-native-store-shots:
    name: iOS Native App Store screenshots
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Build for simulator + Pro Max screenshots
        script: SIM_MAX=1 OUT="$CM_BUILD_DIR/screenshots" mobile/ios-native/scripts/preview-screens.sh
    artifacts:
      - screenshots/*.png
      - screenshots/build.log

  # ٦) صفحة المتجر في App Store Connect: النصوص والصور والتصنيف وملاحظة المراجع (من mobile/ios-native/fastlane). ما يقدّم للمراجعة
  ios-store-listing:
    name: App Store listing upload (metadata + screenshots)
    instance_type: mac_mini_m2
    max_build_duration: 30
    integrations:
      app_store_connect: ohod
    environment:
      xcode: latest
    scripts:
      - name: Upload listing
        script: |
          env | grep -E "^APP_STORE_CONNECT" | sed -E 's/=.*/=<set>/' | sort
          app-store-connect apps list --bundle-id-identifier sa.ohod.store 2>&1 | head -30 || true
          if [ -z "$APP_STORE_CONNECT_PRIVATE_KEY" ]; then echo "NO_KEY_ENV"; exit 0; fi
          python3 - <<'PY'
          import json, os, re, sys
          k = os.environ["APP_STORE_CONNECT_PRIVATE_KEY"].replace("\\n", "\n").strip()
          body = re.sub(r"-----[^-]+-----|\s+", "", k)
          pem = "-----BEGIN PRIVATE KEY-----\n" + "\n".join(body[i:i+64] for i in range(0, len(body), 64)) + "\n-----END PRIVATE KEY-----\n"
          print("key chars:", len(body), "header ok:", k.startswith("-----BEGIN"), "key id len:", len(os.environ["APP_STORE_CONNECT_KEY_IDENTIFIER"]))
          open("/tmp/AuthKey.p8", "w").write(pem)
          json.dump({"key_id": os.environ["APP_STORE_CONNECT_KEY_IDENTIFIER"], "issuer_id": os.environ["APP_STORE_CONNECT_ISSUER_ID"],
                     "key": pem, "in_house": False}, open("/tmp/asc.json", "w"))
          PY
          openssl pkey -in /tmp/AuthKey.p8 -noout && echo "KEY_OK" || { echo "KEY_BAD"; exit 1; }
          cd mobile/ios-native
          fastlane deliver --api_key_path /tmp/asc.json --app_identifier sa.ohod.store --skip_binary_upload true \
            --overwrite_screenshots true --force true --run_precheck_before_submit false --submit_for_review false \
            --metadata_path fastlane/metadata --screenshots_path fastlane/screenshots --ignore_language_directory_validation true 2>&1 | tail -80
          test ${PIPESTATUS[0]} -eq 0

  # ٤) التطبيق الأصلي: بناء موقّع ورفع لـ TestFlight. يشتغل لما ينرفع tag يبدأ بـ ios-native-
  ios-native-testflight:
    name: iOS Native TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'ios-native-*'
          include: true
    integrations:
      app_store_connect: ohod
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: sa.ohod.store
    scripts:
      - name: Install XcodeGen
        script: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Generate project
        script: |
          cd mobile/ios-native
          export OHOD_BUILD_NUMBER=$(date -u +%y%m%d%H%M)
          echo "build number $OHOD_BUILD_NUMBER"
          xcodegen generate
      - name: Use signing profiles
        script: xcode-project use-profiles --project mobile/ios-native/OhodStore.xcodeproj
      - name: Build ipa
        script: xcode-project build-ipa --project mobile/ios-native/OhodStore.xcodeproj --scheme OhodStore
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false

