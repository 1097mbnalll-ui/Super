# بناء تطبيق متاجر أحد للآيفون على Codemagic (ماك سحابي، الخطة المجانية ٥٠٠ دقيقة بالشهر).
# البدء يدوي من لوحة Codemagic: اختر الفرع mobile-app ثم الـ workflow.
# ما فيه أي سر بهالملف: مفتاح App Store Connect يندخل في Codemagic نفسه
# (Team settings ← Integrations ← Developer Portal ← Manage keys)، والتوقيع يُدار هناك.
workflows:
  # ١) فحص البناء بس (محاكي، بدون توقيع ولا حساب آبل)
  ios-check:
    name: iOS build check (simulator)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: latest
      node: 22
    scripts:
      - name: Xcode version
        script: xcodebuild -version
      - name: npm ci + cap sync
        script: |
          cd mobile
          npm ci
          npm run sync
      - name: xcodebuild (simulator, unsigned)
        script: |
          set -o pipefail
          cd mobile/ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -n 200

  # ٢) بناء موقّع ورفع لـ TestFlight (يحتاج حساب آبل مفعّل + مفتاح App Store Connect مربوط في Codemagic باسم ohod)
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    # يدوي فقط (تطبيق غلاف الموقع القديم). التطبيق الأصلي له workflows تحت.
    integrations:
      app_store_connect: ohod
    environment:
      xcode: latest
      node: 22
      ios_signing:
        distribution_type: app_store
        bundle_identifier: sa.ohod.store
    scripts:
      - name: npm ci + cap sync
        script: |
          cd mobile
          npm ci
          npm run sync
      - name: Use signing profiles
        script: xcode-project use-profiles --project mobile/ios/App/App.xcodeproj
      - name: Build number
        script: |
          cd mobile/ios/App
          agvtool new-version -all $((BUILD_NUMBER + 1))
      - name: Build ipa
        script: |
          xcode-project build-ipa --project mobile/ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false   # التجربة الداخلية (المالك وفريقه) ما تحتاج مراجعة؛ النسخة تظهر في TestFlight بعد ما تعالجها آبل

  # ٣) التطبيق الأصلي (SwiftUI): معاينة على المحاكي + صور الشاشات (بدون توقيع). يشتغل مع كل دفعة تلمس mobile/ios-native
  ios-native-preview:
    name: iOS Native Preview (simulator screenshots)
    instance_type: mac_mini_m2
    max_build_duration: 45
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: mobile-app
          include: true
          source: true
      cancel_previous_builds: true
    when:
      changeset:
        includes:
          - 'mobile/ios-native/'
        excludes:
          - 'mobile/ios-native/design/'
          - 'mobile/ios-native/research/'
          - 'mobile/ios-native/fastlane/'
          - 'mobile/ios-native/scripts/'
          - '**/*.md'
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Build for simulator + screenshots
        script: OUT="$CM_BUILD_DIR/screenshots" mobile/ios-native/scripts/preview-screens.sh
    artifacts:
      - screenshots/*.png
      - screenshots/build.log

  # ٥) صور المتجر (App Store): نفس شاشات المعاينة على آيفون Pro Max (مقاس ٦٫٩). يدوي من Codemagic أو الـ API
  ios-native-store-shots:
    name: iOS Native App Store screenshots
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Build for simulator + Pro Max screenshots
        script: SIM_MAX=1 OUT="$CM_BUILD_DIR/screenshots" mobile/ios-native/scripts/preview-screens.sh
    artifacts:
      - screenshots/*.png
      - screenshots/build.log

  # ٦) صفحة المتجر في App Store Connect: النصوص والصور والتصنيف وملاحظة المراجع (من mobile/ios-native/fastlane). ما يقدّم للمراجعة
  ios-store-listing:
    name: App Store listing upload (metadata + screenshots)
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: ohod
    environment:
      xcode: latest
      vars:
        FASTLANE_SKIP_UPDATE_CHECK: "1"
        FASTLANE_OPT_OUT_USAGE: "1"
        FASTLANE_DISABLE_COLORS: "1"
        FASTLANE_HIDE_TIMESTAMP: "1"
        CI: "true"
    scripts:
      - name: 1 - key and login
        script: |
          python3 - <<'PY'
          import base64, glob, json, os, re, subprocess
          E = os.environ
          names = sorted(k for k in E if "APP_STORE" in k or k.startswith("ASC") or "PRIVATE_KEY" in k or "CM_APP_STORE" in k)
          print("env names:", names)
          def kind(v):
              if not v: return "empty"
              if "BEGIN" in v: return "pem(lines=%d,len=%d)" % (v.count("\n") + 1, len(v))
              if os.path.exists(v.strip()): return "path-to-existing-file"
              if v.strip().startswith("/"): return "path-missing"
              return "other(len=%d)" % len(v)
          for n in names:
              if n != "APP_STORE_CONNECT_KEY_IDENTIFIER" and n != "APP_STORE_CONNECT_ISSUER_ID": print(" ", n, "=", kind(E[n]))
          cands = []
          for n in names:
              v = E[n]
              if not v: continue
              if "BEGIN" in v: cands.append(("env:" + n, v.replace("\\n", "\n")))
              elif os.path.exists(v.strip()) and os.path.isfile(v.strip()): cands.append(("file:" + n, open(v.strip()).read()))
              else:
                  try:
                      d = base64.b64decode(v).decode()
                      if "BEGIN" in d: cands.append(("b64:" + n, d))
                  except Exception: pass
          for pat in ["~/.appstoreconnect/private_keys/*.p8", "~/.private_keys/*.p8", "/Users/builder/clone/*.p8"]:
              for f in glob.glob(os.path.expanduser(pat))[:5]:
                  print("found key file:", f); cands.append(("file:" + f, open(f).read()))
          print("candidates:", [c[0] for c in cands])
          ok = None
          for name, raw in cands:
              body = re.sub(r"-----[^-]+-----|\s+", "", raw)
              pem = "-----BEGIN PRIVATE KEY-----\n" + "\n".join(body[i:i+64] for i in range(0, len(body), 64)) + "\n-----END PRIVATE KEY-----\n"
              open("/tmp/AuthKey.p8", "w").write(pem)
              r = subprocess.run(["openssl", "pkey", "-in", "/tmp/AuthKey.p8", "-noout"], capture_output=True)
              print("try", name, "chars", len(body), "->", "OK" if r.returncode == 0 else "no")
              if r.returncode == 0: ok = pem; break
          if not ok: print("KEY_NOT_FOUND"); raise SystemExit(1)
          json.dump({"key_id": E["APP_STORE_CONNECT_KEY_IDENTIFIER"], "issuer_id": E["APP_STORE_CONNECT_ISSUER_ID"], "key": ok, "in_house": False}, open("/tmp/asc.json", "w"))
          PY
          echo "KEY_PARSES_OK"
          # تسجيل دخول تجريبي قبل الرفع (مهلة دقيقتين)
          python3 mobile/ios-native/scripts/run_limited.py 120 ruby -e 'require "spaceship"; t = Spaceship::ConnectAPI::Token.from_json_file("/tmp/asc.json"); Spaceship::ConnectAPI.token = t; puts "LOGIN_OK apps=" + Spaceship::ConnectAPI::App.all.map(&:bundle_id).inspect'
      - name: 2 - metadata only
        script: |
          cd mobile/ios-native
          # ما نلمس معلومات المراجع ولا الحقوق ولا التصنيف (المالك عبّاها يدوي)، ولا نقدّم للمراجعة ولا نفعّل النشر التلقائي
          python3 scripts/run_limited.py 600 fastlane deliver --api_key_path /tmp/asc.json --app_identifier sa.ohod.store --skip_binary_upload true \
            --skip_screenshots true --force true --run_precheck_before_submit false \
            --submit_for_review false --automatic_release false \
            --metadata_path fastlane/metadata --ignore_language_directory_validation true --verbose
      - name: 3 - screenshots only
        script: |
          cd mobile/ios-native
          python3 scripts/run_limited.py 900 fastlane deliver --api_key_path /tmp/asc.json --app_identifier sa.ohod.store --skip_binary_upload true \
            --skip_metadata true --overwrite_screenshots true --force true --run_precheck_before_submit false \
            --submit_for_review false --automatic_release false \
            --screenshots_path fastlane/screenshots --ignore_language_directory_validation true --verbose

  # ٤) التطبيق الأصلي: بناء موقّع ورفع لـ TestFlight. يشتغل لما ينرفع tag يبدأ بـ ios-native-
  ios-native-testflight:
    name: iOS Native TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'ios-native-*'
          include: true
    integrations:
      app_store_connect: ohod
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: sa.ohod.store
    scripts:
      - name: Install XcodeGen
        script: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Generate project
        script: |
          cd mobile/ios-native
          export OHOD_BUILD_NUMBER=$(date -u +%y%m%d%H%M)
          echo "build number $OHOD_BUILD_NUMBER"
          xcodegen generate
      - name: Use signing profiles
        script: xcode-project use-profiles --project mobile/ios-native/OhodStore.xcodeproj
      - name: Build ipa
        script: xcode-project build-ipa --project mobile/ios-native/OhodStore.xcodeproj --scheme OhodStore
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false

