<title data-keep>متاجر أحد</title>
<meta name="claude:viewport-fit-sides" content="cover" data-keep>

<style data-keep>
/* Layout: phone-first grocery app in RTL. Ink-teal brand, orange actions, each aisle on its own tinted plate. Screens: home, categories, aisle, product, search, cart, checkout (map + phone), sent, account. Admin console republishes data through the server. */
:root{
  --ink:#17212B; --ink-2:#3A4652; --muted:#6B7480; --ground:#FFFFFF; --surface:#FFFFFF; --line:#ECEEF1; --tile:#F4F5F7; --sky:#DDF2EE; --sky-2:#BFE7DE;
  --teal:#0E9F7B; --teal-deep:#0A7A5E; --mint:#DDF6EC; --orange:#FF8A1F; --orange-ink:#2B1300; --orange-soft:#FFF0E0; --orange-text:#B5530A;
  --yellow:#FFC93C; --yellow-ink:#2E2100; --pink:#FF4F7E; --grape:#7C5CFA;
  --sale:#F2335B; --danger:#B3261E;
  --display:"Readex Pro",Tahoma,sans-serif;
  --fun:"Readex Pro",Tahoma,sans-serif;
  --body:"Readex Pro",Tahoma,"Segoe UI",sans-serif;
  --shadow:0 2px 10px rgba(23,33,43,.05);
  color-scheme:light;
  /* aliases used by the admin console */
  --bg:var(--ground); --fg:var(--ink); --brand:var(--teal); --brand-deep:var(--teal-deep); --on-brand:#FFFFFF; --wash:var(--mint);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:13.5px;line-height:1.55;padding-bottom:104px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--sky)}
[hidden]{display:none!important}
[dir="ltr"] svg.flip{transform:scaleX(-1)}
.langbtn{flex:none;min-width:38px;height:32px;padding:0 10px;border-radius:999px;border:0;background:rgba(255,255,255,.8);color:var(--ink);font:inherit;font-size:12px;font-weight:700;cursor:pointer}
h1,h2,h3{margin:0;font-family:var(--display);line-height:1.25;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font-family:var(--body)}
a{color:var(--teal-deep)}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px;border-radius:10px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
svg.i{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sq{width:38px;height:38px;border-radius:12px;border:0;background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow);text-decoration:none;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:14px;font-family:var(--display);font-weight:700;font-size:13.5px;text-decoration:none;border:0;cursor:pointer;line-height:1.2}
.btn-ink{background:var(--ink);color:#fff}
.btn-teal,.btn-brand{background:var(--teal);color:#fff}
.btn-orange{background:var(--orange);color:var(--orange-ink)}
.btn-soft{background:var(--mint);color:var(--ink)}
.btn-ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.price{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.price small{font-size:.68em;font-weight:700}
.price.sale{color:var(--sale)}
.card-p .price.sale{color:var(--sale)}
s.was{font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted)}

/* home header */
.hdr{padding-top:12px;display:grid;gap:11px}
.hdr-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:38px;height:38px;border-radius:50%;box-shadow:0 0 0 1px var(--line);flex:none}
.who span{display:block;font-size:10.5px;color:var(--muted)}
.who b{display:flex;align-items:center;gap:4px;font-family:var(--display);font-size:13px}
.who b svg.i{width:14px;height:14px;stroke-width:2.6}
.searchpill{display:flex;align-items:center;gap:9px;height:44px;padding:0 15px;border-radius:15px;background:var(--surface);box-shadow:var(--shadow);color:var(--muted);border:0;width:100%;font:inherit;font-size:13px;cursor:text;text-align:right}
.searchpill input{border:0;outline:0;background:transparent;flex:1;min-width:0;font:inherit;color:var(--ink);font-size:16px}

.hero{margin-top:14px;border-radius:26px;background:var(--ink);color:#fff;padding:16px 16px 15px;position:relative;overflow:hidden;min-height:158px}
.hero::before{content:"";position:absolute;left:-40px;top:-36px;width:190px;height:190px;border-radius:50%;background:var(--teal)}
.hero::after{content:"";position:absolute;left:58px;bottom:-60px;width:116px;height:116px;border-radius:50%;background:var(--orange)}
.hero img{position:absolute;filter:drop-shadow(0 10px 14px rgba(0,0,0,.35));z-index:1}
.hero .txt{position:relative;z-index:2;display:grid;gap:6px;width:60%}
.hero .pill{justify-self:start;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border-radius:999px;padding:3px 9px;font-size:10px;font-weight:700;color:#FFD9B3}
.hero .pill i{width:6px;height:6px;border-radius:50%;background:var(--orange)}
.hero h1{font-weight:700;font-size:clamp(19px,5.6vw,23px)}
.hero p{font-size:10.5px;color:#C9DCD6}
.hero .cta{justify-self:start;margin-top:4px;display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--ink);position:relative;z-index:3;border:0;font-family:var(--display);font-weight:700;font-size:11.5px;padding:8px 13px;border-radius:999px;cursor:pointer}

.cats-row{display:flex;gap:11px;overflow-x:auto;scrollbar-width:none;padding:2px 20px 4px;margin:14px auto 0;max-width:560px}
.cats-row::-webkit-scrollbar{display:none}
.cat-chip{flex:none;width:56px;display:grid;justify-items:center;gap:5px;background:none;border:0;padding:0;cursor:pointer;color:var(--ink);font-size:10.5px;font-weight:700;text-align:center;line-height:1.3}
.cat-chip .plate{width:56px;height:56px;border-radius:18px;display:grid;place-items:center}
.cat-chip .plate img{width:34px;height:34px;object-fit:contain}

.sh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:18px 0 9px}
.sh h2{font-weight:700;font-size:15.5px}
.sh button,.sh a{background:none;border:0;color:var(--teal-deep);font-weight:700;font-size:11.5px;cursor:pointer;text-decoration:none;font-family:var(--body)}
.sh .hint{font-size:11px;color:var(--muted)}

/* product card */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:132px;gap:10px;overflow-x:auto;scrollbar-width:none;padding:2px 20px 6px;margin:0 -20px}
.rail::-webkit-scrollbar{display:none}
.card-p{background:var(--surface);border-radius:20px;padding:6px;display:flex;flex-direction:column;gap:5px;box-shadow:var(--shadow);cursor:pointer;min-width:0;position:relative}
.card-p .plate{position:relative;height:96px;border-radius:15px;display:grid;place-items:center;overflow:hidden}
.card-p .plate img{width:68%;height:80%;object-fit:contain}
.card-p .plate img.photo{width:100%;height:100%;object-fit:cover}
.card-p.out .plate img{filter:grayscale(1);opacity:.5}
.tag{position:absolute;top:6px;right:6px;font-size:9.5px;font-weight:700;padding:1px 7px;border-radius:7px;z-index:1}
.tag.sale{background:var(--sale);color:#fff}
.tag.yellow{background:var(--yellow);color:var(--yellow-ink)}
.tag.fresh{background:#fff;color:var(--teal-deep)}
.tag.deal{background:var(--orange);color:var(--orange-ink)}
.tag.out{background:var(--ink);color:#fff}
.card-p .info{padding:0 4px 4px;display:flex;flex-direction:column;min-width:0}
.card-p .info b{font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-p .info .unit{font-size:10px;color:var(--muted)}
.card-p .info .row{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.card-p .price{font-size:14px;font-family:var(--fun);font-weight:700}
.ctl{position:absolute;bottom:6px;left:6px;z-index:2}
.add{width:32px;height:32px;border-radius:50%;background:#fff;color:var(--teal-deep);box-shadow:0 2px 8px rgba(23,33,43,.16);border:0;display:grid;place-items:center;cursor:pointer}
.add svg.i{width:15px;height:15px;stroke-width:2.6}
.add.locked{background:var(--surface);color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--line);cursor:default}
.stepper{display:flex;align-items:center;gap:2px;background:var(--teal);color:#fff;border-radius:999px;padding:3px}
.stepper button{width:26px;height:26px;border-radius:50%;border:0;background:transparent;color:inherit;display:grid;place-items:center;cursor:pointer}
.stepper button.plus{background:#fff;color:var(--teal-deep)}
.stepper button[disabled]{opacity:.35;cursor:not-allowed}
.stepper button svg.i{width:12px;height:12px;stroke-width:2.8}
.stepper b{min-width:16px;text-align:center;font-size:11.5px}

/* boxes */
.box{background:var(--surface);border-radius:20px;padding:11px 13px;box-shadow:var(--shadow)}
.daily{margin-top:14px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow);padding:9px;display:grid;grid-template-columns:96px 1fr;gap:11px;align-items:center;cursor:pointer;position:relative;border:1.5px solid var(--orange)}
.daily .plate{position:relative;height:96px;border-radius:15px;display:grid;place-items:center;overflow:hidden}
.daily .plate img{width:74%;height:80%;object-fit:contain}
.daily .plate img.photo{width:100%;height:100%;object-fit:cover}
.daily .d{display:grid;gap:4px;min-width:0}
.daily .k{display:flex;align-items:center;gap:5px;font-family:var(--display);font-weight:700;font-size:11.5px;color:var(--orange-text)}
.daily .k svg.i{width:14px;height:14px;fill:currentColor;stroke:none}
.daily h3{font-size:14px;font-weight:700}
.cd{display:inline-flex;align-items:center;gap:5px;font-size:10px;color:var(--muted)}
.cd b{background:var(--ink);color:#fff;border-radius:8px;padding:1px 8px;font-family:var(--display);font-variant-numeric:tabular-nums;direction:ltr}
.lockbox{display:flex;align-items:center;gap:14px}
.lockbox .ic{flex:none;width:42px;height:42px;border-radius:13px;background:var(--orange-soft);display:grid;place-items:center;color:var(--orange-text)}
.lockbox.on .ic{background:var(--mint);color:var(--teal-deep)}
.lockbox .ic svg.i{width:21px;height:21px}
.lockbox .t{flex:1;display:grid;gap:6px;min-width:0}
.lockbox .t div{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lockbox .t b{font-family:var(--display);font-size:12.5px}
.lockbox .t em{font-style:normal;font-size:10.5px;color:var(--orange-text);font-weight:700;white-space:nowrap}
.lockbox .t span{font-size:10px;color:var(--muted)}
.meter{height:6px;border-radius:9px;background:#EEF2F0;overflow:hidden}
.meter i{display:block;height:100%;border-radius:9px;background:var(--orange)}

/* nav + cart bar */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;width:min(480px,calc(100% - 40px));height:64px;border-radius:32px;background:rgba(255,255,255,.82);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:center;gap:4px;padding:0 6px;box-shadow:0 10px 30px rgba(23,33,43,.14);border:1px solid rgba(255,255,255,.7)}
.nav button{background:none;border:0;display:grid;justify-items:center;gap:2px;color:var(--ink);font-size:10.5px;font-weight:500;cursor:pointer;position:relative;padding:7px 0;border-radius:26px;font-family:var(--body)}
.nav button svg.i{width:19px;height:19px}
.nav button[aria-current="page"]{color:var(--teal-deep);background:var(--sky);font-weight:700}
.nav button i{width:4px;height:4px;border-radius:50%}
.nav button[aria-current="page"] i{background:transparent}
.nav .count{position:absolute;top:0;left:calc(50% - 22px);min-width:18px;height:18px;border-radius:9px;background:var(--pink);color:#fff;font-size:10.5px;display:grid;place-items:center;padding:0 4px}
.cartbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:19;width:min(480px,calc(100% - 40px));height:52px;border-radius:26px;background:var(--teal);color:#fff;border:0;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 18px;box-shadow:0 10px 24px rgba(14,159,123,.35);cursor:pointer;font-family:var(--body)}
.cartbar .l{display:flex;align-items:center;gap:10px;text-align:right}
.cartbar .n{width:36px;height:36px;border-radius:50%;background:#fff;color:var(--teal-deep);display:grid;place-items:center;font-family:var(--display);font-weight:700}
.cartbar b{font-family:var(--display);font-size:12.5px;display:block}
.cartbar span{font-size:10px;color:#D8F3EA}
.cartbar .tot{font-family:var(--display);font-weight:700;font-size:14px}

/* sub screens */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:12px}
.topbar h1{font-weight:700;font-size:16.5px;flex:1;text-align:center}
.aisle-head{border-radius:0 0 28px 28px;padding:12px 0 16px;position:relative;overflow:hidden}
.aisle-head img{position:absolute;left:-14px;top:24px;width:118px;opacity:.95;transform:rotate(-14deg)}
.aisle-head img[src^="cat/"]{width:104px;border-radius:28px;box-shadow:0 8px 20px rgba(0,0,0,.12);opacity:1}
.aisle-head h1{position:relative;font-weight:700;font-size:25px;margin-top:12px}
.aisle-head p{position:relative;font-size:11.5px;color:var(--ink-2)}
.prod{min-height:100vh;position:relative;padding-bottom:0}
.prod .art{position:relative;height:262px;display:grid;place-items:center}
.prod .art::before{content:"";position:absolute;width:230px;height:230px;border-radius:50%;background:rgba(255,255,255,.45)}
.prod .art::after{content:"";position:absolute;width:166px;height:166px;border-radius:50%;background:rgba(255,255,255,.35)}
.prod .art img{position:relative;z-index:1;width:182px;height:182px;object-fit:contain;transform:rotate(-6deg);filter:drop-shadow(0 26px 24px rgba(15,42,46,.25))}
.prod .art img.photo{border-radius:28px;object-fit:cover;transform:none}
.prod .sheet-b{background:var(--surface);border-radius:30px 30px 0 0;min-height:calc(100vh - 300px);padding:20px 0 120px;min-height:420px}
.prod .sheet-b .wrap{display:grid;gap:14px}
.prod .ttl{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.prod .ttl h1{font-weight:700;font-size:20px}
.prod .ttl .unit{font-size:11.5px;color:var(--muted)}
.prod .ttl .price{font-size:24px;line-height:1}
.chipline{justify-self:start;background:var(--mint);color:var(--teal-deep);font-size:10px;font-weight:700;padding:3px 10px;border-radius:999px}
.savebar{display:flex;align-items:center;gap:8px;background:var(--orange-soft);color:var(--orange-text);border-radius:14px;padding:8px 11px;font-size:11px;font-weight:700}
.savebar svg.i{width:15px;height:15px;fill:currentColor;stroke:none}
.pairs{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}
.pair{flex:none;display:flex;align-items:center;gap:7px;background:var(--ground);border:0;border-radius:12px;padding:5px 10px 5px 5px;font:inherit;font-size:11px;font-weight:700;color:var(--ink);cursor:pointer}
.pair span{width:32px;height:32px;border-radius:10px;display:grid;place-items:center}
.pair img{width:22px;height:22px;object-fit:contain}
.buybar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(560px,100%);z-index:21;background:var(--surface);padding:12px max(20px,env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;box-shadow:0 -6px 24px rgba(15,42,46,.08)}
.qtybig{display:flex;align-items:center;gap:4px;background:var(--ground);border-radius:18px;padding:5px}
.qtybig button{width:36px;height:36px;border-radius:12px;border:0;background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.qtybig b{font-family:var(--display);font-size:15px;min-width:24px;text-align:center}
.buybar .go{flex:1;justify-content:space-between;min-height:48px;border-radius:16px}
.buybar .go span{color:#F8B271}

/* cart */
.lines{display:grid;gap:10px}
.line{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:18px;padding:8px;box-shadow:var(--shadow)}
.line .plate{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;flex:none;overflow:hidden}
.line .plate img{width:72%;height:72%;object-fit:contain}
.line .plate img.photo{width:100%;height:100%;object-fit:cover}
.line .nm{flex:1;display:grid;min-width:0}
.line .nm b{font-size:12px}
.line .nm span{font-size:10.5px;color:var(--muted)}
.line.off{opacity:.55}
.ltag{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:6px;margin-inline-start:6px;vertical-align:middle}
.ltag.day{background:var(--sale);color:#fff}
.ltag.deal{background:var(--orange);color:var(--orange-ink)}
.line .stepper{background:var(--ground);color:var(--ink)}
.line .stepper button{background:var(--surface);color:var(--ink)}
.darkbar{border-radius:18px;background:var(--ink);color:#fff;padding:11px 13px;display:grid;gap:10px}
.darkbar .r{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11.5px;font-weight:700}
.darkbar .r span:last-child{font-size:10px;color:#8FB0A7;font-weight:400}
.darkbar .meter{background:rgba(255,255,255,.12)}
.totals{display:grid;gap:8px}
.totals div{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2)}
.totals s.was{color:var(--muted);margin-inline-end:4px}.totals b.free{color:var(--brand,#0E8A6A)}.totals .saved{color:#C4560A;font-weight:700}
.codes-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.codes-wrap{overflow-x:auto}.codes-tbl{width:100%;border-collapse:collapse;font-size:14px}.codes-tbl th,.codes-tbl td{padding:8px 6px;border-bottom:1px solid var(--line,#e6e6e6);text-align:start;vertical-align:top;white-space:nowrap}
.pcode-row{display:flex;gap:8px}.pcode-row input{flex:1;min-width:0;text-transform:uppercase}.pcode-row button{flex:none}.promo-msg{margin:6px 0 0;font-size:13px}.promo-msg.ok{color:var(--brand,#0E8A6A)}.promo-msg.bad{color:#B42318}
.totals .grand{padding-top:8px;border-top:1px dashed var(--line);align-items:baseline;color:var(--ink)}
.totals .grand b{font-family:var(--display);font-size:14px}
.totals .grand .price{font-size:18px}
.bottomcta{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(560px,100%);z-index:21;background:var(--surface);padding:12px max(20px,env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 24px rgba(15,42,46,.08)}
.bottomcta .btn{width:100%;min-height:48px;border-radius:16px;font-size:14px;justify-content:space-between}
.empty{display:grid;justify-items:center;gap:14px;text-align:center;padding:70px 20px;color:var(--muted)}
.empty .big{width:76px;height:76px;border-radius:26px;background:var(--surface);display:grid;place-items:center;box-shadow:var(--shadow);color:var(--teal)}
.empty .big svg.i{width:36px;height:36px;stroke-width:1.6}
.empty b{font-family:var(--display);font-size:15px;color:var(--ink)}

/* checkout */
.mapwrap{position:relative;height:290px;background:#E6EEE7;overflow:hidden}
#map{position:absolute;inset:0;z-index:1}
.mapwrap .mpin{position:absolute;left:50%;top:50%;z-index:5;width:44px;height:44px;margin:-50px 0 0 -22px;pointer-events:none}
.mapwrap .mpin div{width:44px;height:44px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--ink);display:grid;place-items:center;box-shadow:0 8px 18px rgba(15,42,46,.35)}
.mapwrap .mpin span{width:16px;height:16px;border-radius:50%;background:var(--orange)}
.mapwrap .dot{position:absolute;left:50%;top:50%;z-index:4;width:12px;height:6px;margin:-3px 0 0 -6px;border-radius:50%;background:rgba(15,42,46,.3);pointer-events:none}
.mapwrap .label{position:absolute;left:50%;top:50%;transform:translate(-50%,-92px);z-index:5;background:var(--ink);color:#fff;border-radius:12px;padding:5px 10px;font-size:11.5px;font-weight:700;white-space:nowrap;pointer-events:none}
.mapwrap .topb{position:absolute;left:max(20px,env(safe-area-inset-left,0px));right:max(20px,env(safe-area-inset-right,0px));top:calc(16px + env(safe-area-inset-top,0px));z-index:6;display:flex;justify-content:space-between}
.mapwrap .locate{position:absolute;left:20px;bottom:46px;z-index:6;min-height:44px;padding:0 14px;border-radius:14px;border:0;background:var(--surface);color:var(--ink);font:inherit;font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:0 4px 14px rgba(15,42,46,.14);cursor:pointer}
.mapwrap .locate svg.i{color:var(--teal)}
.mapnote{position:absolute;inset:0;z-index:2;display:grid;place-items:center;color:var(--muted);font-size:13px;padding:20px;text-align:center}
.co{position:relative;z-index:7;margin-top:-30px;background:var(--surface);border-radius:30px 30px 0 0;padding:22px 0 140px;min-height:60vh}
.co .wrap{display:grid;gap:16px}
.addr{display:flex;align-items:center;gap:12px}
.addr .ic{width:38px;height:38px;border-radius:13px;background:var(--mint);color:var(--teal-deep);display:grid;place-items:center;flex:none}
.addr .t{flex:1;display:grid;line-height:1.35;min-width:0}
.addr .t b{font-family:var(--display);font-size:13px}
.addr .t span{font-size:10.5px;color:var(--muted)}
.addr.ok .ic{background:var(--teal);color:#fff}
.fld{display:grid;gap:5px;font-size:11.5px;font-weight:700}
.fld small{font-weight:400;color:var(--muted);font-size:10.5px}
.fld input,.fld textarea{height:44px;border-radius:14px;background:var(--ground);border:1px solid var(--line);padding:0 14px;font:inherit;font-weight:400;font-size:16px;color:var(--ink);width:100%}
.fld textarea{height:auto;min-height:70px;padding:12px 14px;resize:vertical}
.phone{display:flex;align-items:center;height:46px;border-radius:14px;background:var(--ground);border:1.5px solid var(--line);padding:0 14px;gap:10px;direction:ltr}
.phone.focus,.phone:focus-within{border-color:var(--teal)}
.phone.bad{border-color:var(--sale)}
.phone span{font-family:var(--display);font-weight:700;font-size:13px;color:var(--muted);padding-right:10px;border-right:1px solid var(--line)}
.phone input{flex:1;border:0;outline:0;background:transparent;font-family:var(--display);font-weight:700;font-size:16px;color:var(--ink);min-width:0;letter-spacing:.04em}
.err{color:var(--sale);font-size:12.5px;font-weight:700}
.pays{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pays button{min-height:42px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
.pays button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.alert{border-radius:16px;background:#FDECEA;color:#8C1D15;padding:12px 14px;font-size:13px;font-weight:700;display:grid;gap:10px}

/* sent */
.sent{min-height:100vh;background:var(--ink);color:#fff;position:relative;overflow:hidden;padding:60px 0 40px}
.sent::before{content:"";position:absolute;right:-80px;top:-60px;width:260px;height:260px;border-radius:50%;background:var(--teal);opacity:.55}
.sent::after{content:"";position:absolute;left:-70px;top:320px;width:180px;height:180px;border-radius:50%;background:var(--orange);opacity:.25}
.sent .wrap{position:relative;z-index:1;display:grid;justify-items:center;gap:10px;text-align:center}
.sent .ok{width:104px;height:104px;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center;margin-bottom:12px}
.sent .ok div{width:76px;height:76px;border-radius:50%;background:var(--teal);display:grid;place-items:center;box-shadow:0 16px 34px rgba(31,138,112,.5)}
.sent .ok svg.i{width:38px;height:38px;stroke-width:2.6;color:#fff}
.sent h1{font-weight:700;font-size:23px}
.sent p{font-size:12.5px;color:#C9DCD6;line-height:1.7}
.sent .card{width:100%;margin-top:16px;border-radius:26px;background:rgba(255,255,255,.07);padding:18px;display:grid;gap:14px;text-align:right;border:0;box-shadow:none}
.sent .card .r{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:#8FB0A7}
.sent .card .r b{font-family:var(--display);font-size:14px;color:#fff}
.steps{display:grid}
.steps .s{display:flex;align-items:center;gap:11px;font-size:12px;font-weight:700}
.steps .s i{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center}
.steps .done i{background:var(--teal)}
.steps .now i{border:2px solid var(--orange)}
.steps .now i::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--orange)}
.steps .now{color:#F8B271}
.steps .next i{border:2px solid rgba(255,255,255,.25)}
.steps .next{color:#8FB0A7;font-weight:400}
.steps .bar{width:2px;height:16px;margin-right:13px;background:rgba(255,255,255,.15)}
.steps .bar.on{background:var(--teal)}
.sent .acts{width:100%;display:grid;gap:10px;margin-top:20px}
.sent .acts .btn-ghost{color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.25)}

/* account */
.info{display:grid;margin:0}
.info div{display:flex;justify-content:space-between;gap:12px;padding-block:12px;border-bottom:1px solid var(--line)}
.info dt{color:var(--muted)}
.info dd{margin:0;font-weight:700;text-align:left}

/* vivid home */
.topband{background:var(--teal);color:#fff;border-radius:0 0 30px 30px;padding-bottom:18px;position:relative;overflow:hidden}
.topband::before{content:"";position:absolute;right:-50px;top:-70px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.08)}
.topband::after{content:"";position:absolute;left:-40px;bottom:-90px;width:170px;height:170px;border-radius:50%;background:var(--yellow);opacity:.22}
.topband .hdr{position:relative;z-index:1}
.topband .who span{color:#C8F1E3}
.topband .who b{color:#fff}
.topband .logo{box-shadow:0 0 0 3px rgba(255,255,255,.35)}
.topband .sq{background:rgba(255,255,255,.18);color:#fff;box-shadow:none}
.topband .searchpill{box-shadow:0 6px 16px rgba(0,0,0,.12)}
.topband .greet{font-family:var(--fun);font-size:23px;line-height:1.3;font-weight:700}
.topband .greet em{font-style:normal;color:var(--yellow)}
.oc-row{display:grid;grid-auto-flow:column;grid-auto-columns:84%;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:16px 20px 4px;margin:0 auto;max-width:560px}
.oc-row::-webkit-scrollbar{display:none}
.oc{scroll-snap-align:start;border-radius:26px;padding:16px 16px 14px;min-height:172px;position:relative;overflow:hidden;cursor:pointer;display:grid;align-content:start;gap:4px;box-shadow:var(--shadow);border:0;text-align:right;font:inherit}
.oc::before{content:"";position:absolute;left:-36px;bottom:-46px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.28)}
.oc .kick{position:relative;justify-self:start;display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.35)}
.oc .kick svg.i{width:13px;height:13px}
.oc h3{position:relative;font-family:var(--display);font-weight:700;font-size:16px;max-width:60%}
.oc .big{position:relative;font-family:var(--fun);font-size:36px;line-height:1.05;font-weight:700;white-space:nowrap}
.oc .big small{font-size:15px}
.oc .sm{position:relative;font-size:11px;opacity:.9;max-width:62%}
.oc s{font-size:12px;opacity:.75}
.oc .pic{position:absolute;left:8px;bottom:10px;width:118px;height:118px;object-fit:contain;filter:drop-shadow(0 12px 14px rgba(0,0,0,.22));z-index:1}
.oc .pics{position:absolute;left:6px;bottom:8px;width:132px;height:120px;z-index:1}
.oc .pics img{position:absolute;width:66px;height:66px;object-fit:contain;filter:drop-shadow(0 8px 10px rgba(0,0,0,.2))}
.oc .pics img:nth-child(1){left:0;top:0;transform:rotate(-10deg)}
.oc .pics img:nth-child(2){left:56px;top:18px;transform:rotate(8deg)}
.oc .pics img:nth-child(3){left:18px;top:56px;transform:rotate(-4deg)}
.oc .go{position:relative;justify-self:start;margin-top:6px;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:7px 13px;border-radius:999px;background:#fff;color:var(--ink)}
.oc .cd{position:relative;font-size:10.5px;color:inherit}
.oc .cd b{background:rgba(0,0,0,.78);color:#fff}
.oc .ctl{left:12px;top:12px;bottom:auto;right:auto}
.oc.y{background:var(--yellow);color:var(--yellow-ink)}
.oc.p{background:var(--pink);color:#fff}
.oc.p .kick{background:rgba(255,255,255,.22)}
.oc.t{background:var(--grape);color:#fff}
.oc.t .kick{background:rgba(255,255,255,.2)}
.oc.o{background:var(--orange);color:var(--orange-ink)}
.oc .bar{position:relative;height:7px;border-radius:9px;background:rgba(255,255,255,.3);overflow:hidden;max-width:60%;margin-top:4px}
.oc .bar i{display:block;height:100%;background:#fff;border-radius:9px}
.cats-row.vivid .cat-chip .plate{border-radius:50%;width:58px;height:58px}
.cats-row.vivid .cat-chip{width:60px}
.sh h2 .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:7px;vertical-align:middle}
.lockbox.vivid{background:var(--pink);color:#fff}
.lockbox.vivid .ic{background:rgba(255,255,255,.22);color:#fff}
.lockbox.vivid .t em{color:#fff}
.lockbox.vivid .t span{color:#FFE3EC}
.lockbox.vivid .meter{background:rgba(255,255,255,.3)}
.lockbox.vivid .meter i{background:#fff}
.lockbox.vivid.on{background:var(--teal)}

/* calm home */
.calm-top{background:var(--sky);padding-bottom:16px}
.calm-top .hdr{gap:12px}
.calm-top .loc{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);min-width:0}
.calm-top .loc b{font-weight:700}
.calm-top .loc svg.i{width:18px;height:18px}
.eta{flex:none;background:var(--sky-2);color:var(--teal-deep);border-radius:999px;padding:6px 14px;font-size:12px;font-weight:700}
.calm-top .searchpill{height:48px;border-radius:24px;box-shadow:0 1px 0 rgba(23,33,43,.04);font-size:13.5px}
.promo-row{display:grid;grid-auto-flow:column;grid-auto-columns:46%;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:16px 20px 2px;margin:0 auto;max-width:560px}
.promo-row::-webkit-scrollbar{display:none}
.promo{scroll-snap-align:start;aspect-ratio:3/4;max-width:100%;border-radius:22px;overflow:hidden;position:relative;border:0;cursor:pointer;text-align:right;font:inherit;color:var(--ink);padding:14px 12px;display:flex;flex-direction:column;gap:3px}
.promo .k{font-size:10.5px;font-weight:700;opacity:.8}
.promo h3{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.25}
.promo .p{font-weight:700;font-size:22px;line-height:1.1}
.promo .p s{font-weight:400;font-size:11px;opacity:.6;margin-inline-start:4px}
.promo img{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:72%;max-height:52%;object-fit:contain;filter:drop-shadow(0 10px 12px rgba(0,0,0,.14))}
.promo .pill{position:absolute;bottom:12px;right:12px;left:12px;text-align:center;background:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:6px 0;z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.promo .ctl{left:10px;top:10px;bottom:auto}
[dir="ltr"] .promo .ctl{left:auto;right:10px}
[dir="ltr"] .ctl{left:auto;right:6px}
[dir="ltr"] .tag{right:auto;left:6px}
.promo .cd{font-size:10px}
.promo .cd b{background:var(--ink);color:#fff}
.bubbles{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding:18px 20px 4px;margin:0 auto;max-width:560px}
.bubbles::-webkit-scrollbar{display:none}
.bub{flex:none;width:76px;display:grid;justify-items:center;gap:6px;background:none;border:0;padding:0;cursor:pointer;font:inherit;font-size:11.5px;font-weight:600;color:var(--ink);text-align:center;line-height:1.3}
.bub span{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 2px rgba(255,255,255,.9),0 0 0 2px var(--sky-2)}
.bub img{width:50px;height:50px;object-fit:contain}
.calm-h{font-family:var(--display);font-weight:700;font-size:21px;margin:24px 0 12px;display:flex;justify-content:space-between;align-items:baseline}
.calm-h button{background:none;border:0;font:inherit;font-size:12px;font-weight:600;color:var(--teal-deep);cursor:pointer}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ctile{background:var(--tile);border:0;border-radius:18px;aspect-ratio:3/3.6;max-width:100%;overflow:hidden;position:relative;cursor:pointer;padding:12px 8px 0;display:flex;flex-direction:column;align-items:center;font:inherit;color:var(--ink)}
.ctile::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;background:var(--sky);z-index:0}
.ctile b{font-family:var(--display);font-weight:700;font-size:13px;line-height:1.3;text-align:center;position:relative;z-index:1}
.ctile img{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:74%;height:58%;object-fit:contain;z-index:1;filter:drop-shadow(0 6px 8px rgba(0,0,0,.12))}
.ctile.feat{background:var(--sky)}
.ctile.feat::after{background:var(--sky-2)}
.g3 .card-p{box-shadow:none;border:1px solid var(--line);border-radius:16px;padding:5px}
.g3 .card-p .plate{height:86px;border-radius:12px}
.card-p .plate{background:var(--tile)}
.lockbox.calm{background:#FFE8EF;color:var(--ink)}
.lockbox.calm .ic{background:#fff;color:var(--pink)}
.lockbox.calm .meter{background:#fff}
.lockbox.calm .meter i{background:var(--pink)}
.lockbox.calm.on{background:var(--mint)}
.lockbox.calm.on .ic{color:var(--teal)}

/* driver */
.drv-head{background:var(--ink);color:#fff;padding:16px 0 18px;border-radius:0 0 28px 28px}
.drv-head .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.drv-head h1{font-weight:700;font-size:18px}
.drv-head .live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#C9DCD6}
.drv-head .live i{width:8px;height:8px;border-radius:50%;background:#3DDC97;box-shadow:0 0 0 4px rgba(61,220,151,.18)}
.drv-head .live.off i{background:var(--sale);box-shadow:none}
.drv-head .sq{background:rgba(255,255,255,.12);color:#fff;box-shadow:none}
.dtabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.dtabs button{min-height:38px;border-radius:12px;border:0;background:rgba(255,255,255,.1);color:#C9DCD6;font:inherit;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.dtabs button[aria-pressed="true"]{background:#fff;color:var(--ink)}
.dtabs b{min-width:20px;height:20px;border-radius:10px;background:var(--orange);color:var(--orange-ink);font-size:11px;display:grid;place-items:center;padding:0 5px}
.ord{background:var(--surface);border-radius:24px;box-shadow:var(--shadow);padding:14px;display:grid;gap:12px}
.ord.fresh{box-shadow:0 0 0 2px var(--orange),var(--shadow)}
.ord .r1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ord .no{font-family:var(--display);font-weight:700;font-size:15px;direction:ltr}
.ord .ago{font-size:12px;color:var(--muted)}
.spill{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px}
.spill.new{background:var(--orange);color:var(--orange-ink)}
.spill.accepted{background:#E3F0FA;color:#14507A}
.spill.onway{background:var(--mint);color:var(--teal-deep)}
.spill.delivered{background:var(--ground);color:var(--muted)}
.spill.canceled{background:#FDECEA;color:#8C1D15}
.ord .money{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.ord .money .price{font-size:18px}
.ord .money span{font-size:12.5px;color:var(--muted)}
.ord .where{display:grid;gap:3px;background:var(--ground);border-radius:14px;padding:8px 10px;font-size:12px}
.ord .where b{font-size:12.5px}
.ord .btns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ord .btns a{min-height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:5px;font-weight:700;font-size:11.5px;text-decoration:none;background:var(--mint);color:var(--teal-deep)}
.ord .btns a.map{background:var(--ink);color:#fff}
.ord details{font-size:13.5px}
.ord summary{cursor:pointer;font-weight:700;color:var(--teal-deep)}
.ord ul{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.ord li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.ord .note{background:var(--orange-soft);color:var(--orange-text);border-radius:12px;padding:8px 10px;font-size:13px;font-weight:700}
.ord .act{display:flex;gap:8px}
.ord .act .btn{flex:1;min-height:44px}
.ord .act .cancel{flex:none;padding:0 14px;background:transparent;color:var(--sale);box-shadow:inset 0 0 0 1.5px var(--line);font-size:13px}
.trackbar{display:flex;align-items:center;gap:12px;background:var(--ink);color:#fff;border-radius:20px;padding:12px 14px;border:0;width:100%;font:inherit;text-align:right;cursor:pointer}
.trackbar .ic{width:40px;height:40px;border-radius:13px;background:var(--orange);color:var(--orange-ink);display:grid;place-items:center;flex:none}
.trackbar .t{flex:1;display:grid;line-height:1.35}
.trackbar .t b{font-family:var(--display);font-size:14px}
.trackbar .t span{font-size:12px;color:#C9DCD6}

/* shared (admin) */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:12;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{max-width:1120px;display:flex;align-items:center;gap:12px;padding-block:10px}
.top .brandname{display:grid;line-height:1.25;min-width:0}
.top .brandname b{font-family:var(--display);font-size:1.05rem}
.top .brandname span{font-size:.78rem;color:var(--muted)}
.top .grow{flex:1}
main.wrap[style*="grid"]{max-width:1120px}
.search{font:inherit;color:var(--ink);background:var(--ground);border:1px solid var(--line);border-radius:12px;padding:10px 14px;width:100%;min-width:0}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sec-head h2{font-size:1.1rem;font-weight:700}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(6,16,20,.55);display:grid;align-items:end;justify-items:center}
.panel{background:var(--surface);width:min(640px,100%);max-height:92%;overflow:auto;border-radius:26px 26px 0 0;padding:20px max(20px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.panel-head h2{font-size:1.2rem;font-weight:700}
label{display:grid;gap:4px;font-weight:700;font-size:.85rem}
input,textarea,select{font:inherit;font-weight:400;color:var(--ink);background:var(--ground);border:1px solid var(--line);border-radius:12px;padding:9px 11px;width:100%;min-width:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.row2{grid-template-columns:1fr}}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.status{color:var(--teal-deep);font-size:.85rem;font-weight:700}

.upload{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.pick{display:flex;flex-wrap:wrap;gap:6px;max-height:220px;overflow:auto;padding:2px}

/* ---------- admin redesign ---------- */
.adm{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh;background:var(--ground);direction:rtl}

.adm-main{min-width:0}

.adm-body{padding:24px 28px 80px;display:grid;gap:16px;max-width:1120px}

.adm .fields{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:grid;gap:2px;text-align:start;font:inherit;color:var(--ink);cursor:pointer}
button.stat:hover{border-color:var(--teal)}
.stat b{font-size:28px;font-weight:900;line-height:1.2}
.stat span{font-size:12.5px;color:var(--muted)}

.olist{display:grid;gap:6px;margin-top:10px}

.quick{display:flex;flex-wrap:wrap;gap:8px}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.theme{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:10px;display:grid;gap:8px;cursor:pointer;font:inherit;color:var(--ink);text-align:start;position:relative}

.adm .arow .imgbtn{grid-row:span 2;width:72px;height:72px;border-radius:14px;align-self:start;border-style:solid;border-color:var(--line);background:var(--tile)}

.adm .catrow{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;grid-template-columns:64px minmax(0,1fr) auto auto}
.cat-names{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.adm .lay-row{border-radius:14px}
@media (max-width:899px){

}
.lay-size{display:grid;gap:6px;background:var(--tile);border-radius:14px;padding:12px 14px}

.mv .mv-end{width:auto;padding:0 9px;font-size:11.5px;font-weight:700}
@media (max-width:899px){.lay-row{flex-wrap:wrap}.lay-row b{flex:1 1 55%}.lay-row .mv{margin-inline-start:auto}}
.adm .arow input.lowq{border-color:#F08A2C;background:#FFF4E8}
.adm .btn.sm{padding:6px 12px;font-size:.78rem;min-height:0}
.lowlist{display:grid;gap:6px;margin-top:10px}
.lowlist>b{font-size:.85rem}
.lowrow{display:flex;align-items:center;gap:10px;background:var(--tile);border:0;border-radius:12px;padding:6px 10px;font:inherit;color:var(--ink);cursor:pointer;text-align:start}
.lowrow img,.lowrow .noimg{width:32px;height:32px;object-fit:contain;mix-blend-mode:multiply}

.lowrow em.low{background:#FFF1E6;color:#B4470B}.lowrow em.zero{background:#FDE8EA;color:#B42335}
.pp-sel{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border:1px dashed var(--line);border-radius:14px;min-height:44px;align-items:center}

.pp-grid{max-height:46vh}

.banrow{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:14px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px}

.thumbs{display:flex;gap:4px;align-items:center}
