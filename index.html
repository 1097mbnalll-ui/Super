<title data-keep>متاجر أحد</title>
<meta name="claude:viewport-fit-sides" content="cover" data-keep>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap" data-keep>
<style data-keep>
/* Layout: app-style grocery storefront (RTL). Brand header + pill search over a soft mint wash, promo carousel, free-delivery card, sticky chip filters, 2-up product cards with a + on the image, floating bottom tab bar. Screens: home, categories, category, search, cart, more. Admin console republishes the page. */
:root{
  --bg:#F7FAF9; --surface:#FFFFFF; --fg:#1D3557; --muted:#667784; --line:#E3EBE8;
  --brand:#3F9C86; --brand-deep:#2A7A68; --on-brand:#FFFFFF; --mint:#E6F3EF; --wash:#DDF0EA;
  --orange:#E5893A; --orange-deep:#C2621A; --orange-soft:#FDEEDF; --sale:#D9472B; --sale-soft:#FCE7E2; --danger:#B3261E;
  --nav:rgba(255,255,255,.92);
  --font:"Almarai",Tahoma,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F181C; --surface:#172429; --fg:#E6EEF1; --muted:#9DB0B8; --line:#26363D;
  --brand:#4DB59B; --brand-deep:#3FA58C; --on-brand:#06140F; --mint:#1A2F2A; --wash:#14302A;
  --orange:#F09A4E; --orange-deep:#F4AE6E; --orange-soft:#3A2716; --sale:#F27A63; --sale-soft:#3A1E18; --danger:#F2867E;
  --nav:rgba(23,36,41,.94); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F181C; --surface:#172429; --fg:#E6EEF1; --muted:#9DB0B8; --line:#26363D;
  --brand:#4DB59B; --brand-deep:#3FA58C; --on-brand:#06140F; --mint:#1A2F2A; --wash:#14302A;
  --orange:#F09A4E; --orange-deep:#F4AE6E; --orange-soft:#3A2716; --sale:#F27A63; --sale-soft:#3A1E18; --danger:#F2867E;
  --nav:rgba(23,36,41,.94); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.55;direction:rtl;padding-bottom:160px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--wash)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;line-height:1.35;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font-family:var(--font)}
a{color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px;border-radius:8px}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:14px;font-weight:700;font-size:.95rem;text-decoration:none;border:0;cursor:pointer;line-height:1.2}
.btn-brand{background:var(--brand-deep);color:var(--on-brand)}
.btn-orange{background:var(--orange);color:#2A1404}
.btn-soft{background:var(--mint);color:var(--fg)}
.btn-ghost{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--fg);display:grid;place-items:center;cursor:pointer;flex:none}

/* header */
.head{background:linear-gradient(180deg,var(--wash),var(--bg))}
.head .wrap{display:grid;gap:12px;padding-block:14px 12px}
.headrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brandline{display:flex;align-items:center;gap:10px}
.logo{width:48px;height:48px;border-radius:50%;flex:none;box-shadow:0 0 0 1px var(--line)}
.brandname{display:grid;line-height:1.2}
.brandname b{font-size:1.45rem;font-weight:800;color:var(--brand-deep)}
.meta{display:grid;justify-items:end;gap:4px}
.chipdash{border:1.5px dashed var(--orange);background:var(--orange-soft);color:var(--orange-deep);border-radius:10px;padding:2px 10px;font-size:.78rem;font-weight:700;display:inline-flex;gap:4px;align-items:center}
.chipdash svg.i{width:14px;height:14px}
.loc{color:var(--muted);font-size:.78rem;display:inline-flex;gap:4px;align-items:center}
.loc svg.i{width:13px;height:13px}
.searchpill{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 16px;height:48px;box-shadow:0 2px 10px rgba(29,53,87,.05);cursor:text;width:100%;color:var(--muted);font-size:.92rem;text-align:right}
.searchpill input{border:0;background:transparent;padding:0;height:100%;flex:1;min-width:0;color:var(--fg);font-size:.95rem;outline:none}

/* promo carousel */
.carousel{position:relative;border-radius:22px;overflow:hidden;margin-top:4px}
.slides{display:grid;grid-auto-flow:column;grid-auto-columns:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.slide{scroll-snap-align:start;min-height:190px;display:grid;grid-template-columns:1fr 42%;align-items:center;gap:8px;padding:20px 22px;position:relative;overflow:hidden}
.slide.s1{background:linear-gradient(120deg,#2A7A68,#3F9C86)}
.slide.s2{background:linear-gradient(120deg,#C2621A,#E5893A)}
.slide.s3{background:linear-gradient(120deg,#1D3557,#2E5A84)}
.slide h2{color:#fff;font-size:clamp(1.25rem,4.4vw,1.8rem);font-weight:800}
.slide p{color:rgba(255,255,255,.9);font-size:.85rem;margin-top:6px}
.slide .cta{margin-top:12px;display:inline-flex;background:#fff;color:#1D3557;border-radius:999px;padding:7px 18px;font-weight:800;font-size:.85rem;border:0;cursor:pointer}
.slide .art{position:relative;aspect-ratio:1/1;max-width:100%}
.slide .art::before{content:"";position:absolute;inset:4%;border-radius:50%;background:rgba(255,255,255,.18)}
.slide .art img{position:absolute;width:52%;filter:drop-shadow(0 8px 10px rgba(0,0,0,.2))}
.dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:5px}
.dots i{width:6px;height:6px;border-radius:9px;background:rgba(255,255,255,.55)}
.dots i.on{width:18px;background:#fff}

.freecard{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-top:14px}
.freecard .ic{width:46px;height:46px;border-radius:14px;background:var(--sale-soft);color:var(--sale);display:grid;place-items:center;flex:none}
.freecard b{font-size:1rem;font-weight:800;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.freecard .tagfree{background:var(--sale);color:#fff;border-radius:6px;padding:0 7px;font-size:.72rem}
.freecard span{color:var(--muted);font-size:.8rem}

/* chips */
.chipsbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:12;background:var(--bg);padding-block:10px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);color:var(--fg);border-radius:12px;padding:6px 12px;font-size:.88rem;font-weight:700;cursor:pointer;white-space:nowrap}
.chip img{width:22px;height:22px}
.chip[aria-pressed="true"]{background:var(--mint);border-color:var(--brand);color:var(--brand-deep)}
.chip.sq{padding:6px 9px}

/* section heads */
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 12px}
.sh h2{font-size:1.25rem;font-weight:800;display:flex;align-items:center;gap:8px}
.sh h2 img{width:30px;height:30px}
.sh button{background:none;border:0;color:var(--brand-deep);font-weight:700;font-size:.85rem;cursor:pointer;display:inline-flex;gap:2px;align-items:center}

/* product cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px 12px}
@media (max-width:460px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 10px}}
.p{display:grid;gap:6px;min-width:0;align-content:start}
.p .ph{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;aspect-ratio:1/1;max-width:100%;display:grid;place-items:center;overflow:hidden}
.p .ph img{width:66%;height:66%;object-fit:contain}
.p .ph img.photo{width:100%;height:100%;object-fit:cover}
.p.out .ph img{filter:grayscale(1);opacity:.5}
.sale{position:absolute;top:8px;left:8px;background:var(--sale);color:#fff;border-radius:8px;padding:1px 8px;font-size:.7rem;font-weight:800;display:inline-flex;gap:4px;align-items:center}
.fresh{position:absolute;top:8px;left:8px;background:var(--mint);color:var(--brand-deep);border-radius:8px;padding:1px 8px;font-size:.7rem;font-weight:800}
.outlbl{position:absolute;inset:auto 8px 8px auto;background:var(--fg);color:var(--bg);border-radius:8px;padding:1px 8px;font-size:.72rem;font-weight:700}
.ctl{position:absolute;bottom:8px;left:8px}

  }
  document.addEventListener("input", onAdminInput);
  document.addEventListener("change", function(e){ if (e.target.dataset && (e.target.dataset.f === "cat" || e.target.dataset.f === "stock")) onAdminInput(e); });
  document.addEventListener("click", function(e){
    if (mode !== "admin") return;
    var t;
    if ((t = e.target.closest("[data-pick]"))) { pickTarget = t.dataset.pick; openPicker(); return; }
    if ((t = e.target.closest("[data-del-prod]"))) {
      if (t.dataset.confirm !== "1") { t.dataset.confirm = "1"; t.textContent = "متأكد؟ اضغط ثاني"; return; }
      draft.products = draft.products.filter(function(p){ return p.id !== t.dataset.delProd; }); markDirty(); renderAProds(); renderACats(); return;
    }
    if ((t = e.target.closest("[data-del-cat]")) && !t.disabled) {
      draft.cats = draft.cats.filter(function(c){ return c.id !== t.dataset.delCat; }); markDirty(); renderACats(); renderAFilter(); return;
    }
    if ((t = e.target.closest("[data-img]"))) { setPicked(t.dataset.img); }
  });
  function openPicker(){
    var used = {}; draft.products.forEach(function(p){ used[p.img] = 1; });
    var keys = Object.keys(draft.imgs).filter(function(k){ return k !== "logo"; });
    keys.sort(function(a,b){ return (isPhoto(b) ? 1 : 0) - (isPhoto(a) ? 1 : 0); });
    $("pickGrid").innerHTML = keys.map(function(k){ return '<button type="button" data-img="' + k + '">' + '<img src="' + draft.imgs[k] + '" alt=""' + (isPhoto(k) ? ' class="photo"' : '') + '></button>'; }).join("");
    $("pickSheet").hidden = false;
  }
  function setPicked(k){
    var parts = pickTarget.split(":");
    if (parts[0] === "cat") draft.cats.forEach(function(c){ if (c.id === parts[1]) c.img = k; });
    else { var p = dById(parts[1]); if (p) p.img = k; }
    markDirty(); $("pickSheet").hidden = true; renderACats(); renderAProds();
  }
  function onUpload(){
    var f = this.files && this.files[0]; this.value = "";
    if (!f) return;
    var r = new FileReader();
    r.onload = function(){
      var im = new Image();
      im.onload = function(){
        var max = 360, sc = Math.min(1, max / Math.max(im.width, im.height));
        var c = document.createElement("canvas"); c.width = Math.round(im.width * sc); c.height = Math.round(im.height * sc);
        var x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(im, 0, 0, c.width, c.height);
        var url = c.toDataURL("image/webp", 0.78); if (url.indexOf("image/webp") < 0) url = c.toDataURL("image/jpeg", 0.8);
        var k = uid("u"); draft.imgs[k] = url; setPicked(k);
      };
      im.onerror = function(){ $("aStatus").className = "status err"; $("aStatus").textContent = "ما قدرنا نقرأ الصورة. جرّب صورة JPG أو PNG."; };
      im.src = r.result;
    };
    r.readAsDataURL(f);
  }
  function buildHtml(data){
    var used = { logo: 1, e1f6d2: 1, e1f35e:1, e1f95b:1, e1f345:1, e1f34c:1, e1f950:1, e1f96c:1 };
    data.products.forEach(function(p){ used[p.img] = 1; }); data.cats.forEach(function(c){ used[c.img] = 1; });
    Object.keys(data.imgs).forEach(function(k){ if (isPhoto(k) && !used[k]) delete data.imgs[k]; });
    var json = JSON.stringify(data).replace(/</g, "\\u003c");
    var parts = KEEP.map(function(h){ return h === null ? '<script type="application/json" id="store-data" data-keep>' + json + '<\/script>' : h; });
    return HEAD + "\n" + parts.join("\n") + "\n</body></html>";
  }
  function publish(){
    var st = $("aStatus"), btn = $("aSave");
    var bad = draft.products.filter(function(p){ return !p.name.trim() || !(p.price > 0); });
    if (bad.length) { st.className = "status err"; st.textContent = "فيه " + num(bad.length) + " منتج بدون اسم أو سعره صفر. صحّحها وبعدين احفظ."; return; }
    var dyl = (draft.store.daily && draft.store.daily.list) || [];
    if (dyl.some(function(x){ return !dById(x.id) || !(x.price > 0); })) { st.className = "status err"; st.textContent = "فيه يوم في عرض اليوم بدون منتج أو سعره صفر."; return; }
    if (draft.store.deal95) draft.store.deal95.ids = draft.store.deal95.ids.filter(function(id){ return dById(id); });
    btn.disabled = true; st.className = "status"; st.textContent = "جاري الحفظ…";
    var html = buildHtml(JSON.parse(JSON.stringify(draft)));
    claude.use("artifact").then(function(a){
      if (!a) throw { code: "not_granted" };
      try { sessionStorage.setItem("ohod-mode", "admin"); } catch(e){}
      return a.publish(html);
    }).then(function(){
      dirty = false; btn.disabled = false; st.textContent = "انحفظ ونُشر"; $("aState").textContent = "كل شي محفوظ";
    }).catch(function(err){
      btn.disabled = false; st.className = "status err";
      var c = err && err.code;
      st.textContent = c === "conflict" ? "أحد ثاني حفظ تعديل قبلك، الصفحة بتتحدث الحين." :
        (c === "not_writer" || c === "not_granted") ? "ما عندك صلاحية تعديل هذا المتجر." :
        c === "too_large" ? "الصور كثيرة أو كبيرة. احذف بعض الصور المرفوعة وجرّب." :
        "ما انحفظ، جرّب مرة ثانية بعد شوي.";
    });
  }

  
  /* ---------- routing ---------- */
  function go(m){ window.scrollTo(0,0); if (m === "admin" && canEdit) { mode = "admin"; adminShell(); } else { mode = "store"; screen = "home"; render(); } }
  var startAdmin = false; try { startAdmin = sessionStorage.getItem("ohod-mode") === "admin"; sessionStorage.removeItem("ohod-mode"); } catch(e){}
  go("store");
  if (window.claude && claude.use) {
    claude.use("user").then(function(u){ return u ? u.canEdit() : false; }).then(function(ok){
      canEdit = !!ok; if (!canEdit) return;
      if (startAdmin) go("admin"); else if (mode === "store" && screen === "more") render();
    }).catch(function(){});
  }
})();
</script>

</body></html>
