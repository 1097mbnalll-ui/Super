<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;width:1600px;height:1100px;overflow:hidden;background:linear-gradient(#DCEBF2 0 62%,#C9C3B8 62% 64%,#8E8A84 64% 100%);position:relative;font-family:sans-serif}
.road{position:absolute;left:0;right:0;top:820px;height:10px;background:repeating-linear-gradient(90deg,#F4F1EA 0 120px,transparent 120px 220px);opacity:.8}
.bld{position:absolute;bottom:396px;background:#BFD4DC;border-radius:6px 6px 0 0}
svg.bike{position:absolute;left:180px;top:420px;width:1150px}
.scene{position:absolute;left:1000px;top:318px;perspective:2400px}
.box{position:relative;width:320px;height:320px;transform-style:preserve-3d;transform:rotateX(-8deg) rotateY(-52deg)}
.f{position:absolute;width:320px;height:320px;background-size:cover;border-radius:8px}
.bk{background-image:url(box-back2.png);transform:rotateY(90deg) translateZ(160px)}
.sd2{background-image:url(box-side.png);transform:translateZ(160px);filter:brightness(.86)}
.tp{background:#E9E3D6;transform:rotateX(90deg) translateZ(160px)}
.shadow{position:absolute;left:250px;top:905px;width:1050px;height:60px;background:radial-gradient(ellipse,rgba(0,0,0,.35),transparent 70%)}
</style></head><body>
