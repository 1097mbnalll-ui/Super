apply plugin: 'com.android.application'

// توقيع النسخة النهائية (release): المفتاح وكلماته من متغيرات البيئة (البناء السحابي) أو من ملف keystore.properties المحلي (مستثنى من git).
// ما ينكتب شي من هذا بالمستودع (عام). بدونها يطلع الملف غير موقّع ولا يفشل البناء.
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }
def signValue = { String env, String prop -> System.getenv(env) ?: keystoreProps.getProperty(prop) }
// رقم الإصدار لازم يزيد مع كل رفع لقوقل. من البناء السحابي (ANDROID_VERSION_CODE) أو -PversionCode=N
def versionCodeValue = Integer.parseInt((System.getenv("ANDROID_VERSION_CODE") ?: project.findProperty("versionCode") ?: "1").toString())
// تطبيق المالك (نفس المشروع، هوية وحزمة ثانية): -PownerApp=1 أو OWNER_APP=1
def ownerApp = ((System.getenv("OWNER_APP") ?: project.findProperty("ownerApp") ?: "").toString() == "1")
def versionNameValue = (System.getenv("ANDROID_VERSION_NAME") ?: project.findProperty("versionName") ?: "1.0").toString()

android {
    namespace = "sa.ohod.store"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId(ownerApp ? "sa.ohod.owner" : "sa.ohod.store")
        manifestPlaceholders = [appLabel: ownerApp ? "إدارة أحد" : "@string/app_name", actLabel: ownerApp ? "إدارة أحد" : "@string/title_activity_main", appIcon: ownerApp ? "@mipmap/ic_owner" : "@mipmap/ic_launcher", appRoundIcon: ownerApp ? "@mipmap/ic_owner" : "@mipmap/ic_launcher_round"]
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode versionCodeValue
        versionName versionNameValue
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            def storePath = signValue('ANDROID_KEYSTORE_PATH', 'storeFile')
            if (storePath) {
                storeFile file(storePath)
                storePassword signValue('ANDROID_KEYSTORE_PASSWORD', 'storePassword')
                keyAlias signValue('ANDROID_KEY_ALIAS', 'keyAlias')
                keyPassword signValue('ANDROID_KEY_PASSWORD', 'keyPassword')
            }
        }
    }
    buildTypes {
        release {
            if (signingConfigs.release.storeFile) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
