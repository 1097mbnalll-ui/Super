# مشروع تطبيق متاجر أحد الأصلي (SwiftUI). يتولّد ملف Xcode منه بـ XcodeGen:  xcodegen generate
# رقم البناء يجي من OHOD_BUILD_NUMBER (Codemagic يحطه)، والافتراضي 1 للتجارب.
name: OhodStore
options:
  bundleIdPrefix: sa.ohod
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ar
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "${OHOD_BUILD_NUMBER}"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: NO
targets:
  OhodStore:
    type: application
    platform: iOS
    sources:
      - path: OhodStore
    # إشعارات حالة الطلب (APNs). App ID فيه Push مفعّل
    entitlements:
      path: OhodStore/OhodStore.entitlements
      properties:
        aps-environment: production
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sa.ohod.store
        PRODUCT_NAME: OhodStore
        INFOPLIST_FILE: OhodStore/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
schemes:
  OhodStore:
    build:
      targets:
        OhodStore: all
    run:
      config: Debug
    archive:
      config: Release
