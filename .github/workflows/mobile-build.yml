# بناء تطبيق متاجر أحد للزبائن (أندرويد وآيفون) على خوادم GitHub المجانية (المستودع عام).
# يشتغل مع كل دفعة على فرع mobile-app تلمس التطبيق، أو يدوياً من تبويب Actions.
# أندرويد: يطلع ملف APK للتجربة (debug) كـ artifact. آيفون: بناء للمحاكي بدون توقيع (يتأكد إن المشروع ينبني بـ Xcode 26).
# الأسرار (اختيارية، تنضاف من Settings ← Secrets and variables ← Actions، ما تنحط بالمستودع):
#   GOOGLE_SERVICES_JSON  نص ملف google-services.json من Firebase (بدونه إشعارات أندرويد مخفية)
name: mobile-build

on:
  # يدوي فقط (دقائق البناء مدفوعة): شغّله من تبويب Actions لما تحتاجه
  workflow_dispatch:

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: npm ci
        working-directory: mobile
        run: npm ci
      - name: google-services.json (لو موجود كسر)
        working-directory: mobile
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSJ" ]; then printf '%s' "$GSJ" > android/app/google-services.json; echo "Firebase: موجود"; else echo "Firebase: ناقص (الإشعارات مخفية في أندرويد)"; fi
      - name: build www + cap sync
        working-directory: mobile
        run: npm run sync
      - name: gradle assembleDebug
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug
      - name: gradle bundleRelease (unsigned, proves the Play bundle builds)
        working-directory: mobile/android
        run: ./gradlew --no-daemon bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: ohod-store-android-debug
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: ohod-store-android-unsigned-aab
          path: mobile/android/app/build/outputs/bundle/release/*.aab
          retention-days: 7

  ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Select Xcode 26
        run: |
          ls -d /Applications/Xcode*.app || true
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "::error::Xcode 26 مو موجود على هالجهاز"; exit 1; fi
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - name: npm ci
        working-directory: mobile
        run: npm ci
      - name: build www + cap sync
        working-directory: mobile
        run: npm run sync
      - name: xcodebuild (simulator, unsigned)
        working-directory: mobile/ios/App
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -n 200
