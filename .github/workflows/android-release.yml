# Builds the SIGNED Android App Bundle (.aab) to upload to Google Play. Manual only (Actions tab > android-release > Run workflow).
# Needs these repository secrets (Settings > Secrets and variables > Actions). Never put them in the repo:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD   (made by mobile/scripts/make-upload-key.sh)
#   GOOGLE_SERVICES_JSON   (optional) Firebase file; without it Android push notifications stay hidden in the app
name: android-release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name shown to users (e.g. 1.0)"
        default: "1.0"
        required: true

permissions:
  contents: read

jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Check signing secrets exist
        env:
          K: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          P: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          A: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in K P A KP; do
            if [ -z "${!v}" ]; then echo "::error::Missing signing secret ($v). See mobile/scripts/make-upload-key.sh"; exit 1; fi
          done
      - name: npm ci
        working-directory: mobile
        run: npm ci
      - name: google-services.json (optional)
        working-directory: mobile
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSJ" ]; then printf '%s' "$GSJ" > android/app/google-services.json; echo "Firebase: present"; else echo "Firebase: missing (push hidden on Android)"; fi
      - name: Build web assets + cap sync
        working-directory: mobile
        run: npm run sync
      - name: Decode upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
      - name: gradle bundleRelease
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ inputs.version_name }}
        run: ./gradlew --no-daemon bundleRelease
      - name: Verify the bundle is signed
        run: |
          AAB=$(ls mobile/android/app/build/outputs/bundle/release/*.aab | head -1)
          echo "Bundle: $AAB"
          jarsigner -verify "$AAB" | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: ohod-store-android-release-aab
          path: mobile/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
