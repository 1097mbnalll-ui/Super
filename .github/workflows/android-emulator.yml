# تجربة تطبيق أندرويد على محاكي حقيقي (Android 15, API 35) بعد كل تعديل على فرع mobile-app.
# يبني من ملفات الفرع (ANDROID_LOCAL=1)، يشغّل التطبيق، يصوّر الشاشات، يقيس سلاسة التمرير،
# ويتأكد إن المحتوى ما ينغطى بأشرطة النظام. النتائج في artifact اسمه android-emulator-results.
name: android-emulator

on:
  push:
    branches: [mobile-app]
    paths: ['mobile/**', 'index.html', 'privacy.html', 'delete-data.html', '.github/workflows/android-emulator.yml']
  workflow_dispatch:

concurrency:
  group: android-emulator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # فقط لدفع لقطات الشاشة لفرع emu-results

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: npm ci
        working-directory: mobile
        run: npm ci
      - name: build (local files)
        working-directory: mobile
        env:
          ANDROID_LOCAL: '1'
        run: |
          npm run sync
          cd android
          for i in 1 2 3; do ./gradlew --no-daemon assembleDebug && exit 0; echo "retry $i"; sleep 20; done; exit 1
      - name: run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: mobile
          script: ./scripts/emulator-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-results
          path: mobile/emu-out
          retention-days: 14
      - name: publish small screenshots to branch emu-results (readable without artifact download)
        if: always()
        run: |
          [ -d mobile/emu-out ] || exit 0
          D=$RUNNER_TEMP/emu; rm -rf $D
          git clone -q --depth 1 -b emu-results "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" $D 2>/dev/null || { mkdir -p $D && cd $D && git init -q -b emu-results && git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"; cd -; }
          rm -rf $D/latest && mkdir -p $D/latest
          cp mobile/emu-out/*.png $D/latest/
          cp mobile/emu-out/report.json mobile/emu-out/window.txt $D/latest/ 2>/dev/null || true
          echo "${{ github.sha }} run ${{ github.run_id }}" > $D/latest/SOURCE.txt
          cd $D && git add -A latest && git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -qm "emulator results ${{ github.run_number }}" && git push -q origin HEAD:emu-results || echo "nothing to push"
