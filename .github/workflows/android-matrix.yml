# محاكاة تطبيق أندرويد على عدة أجهزة وإصدارات (يشتغل بس لما ملف mobile/store/matrix-trigger.txt يتغير، أو يدوي).
# دقائق البناء مدفوعة: شغّله بس لما تحتاجه. يبني الـAPK مرة وحدة (من ملفات الفرع) ويجربه على كل جهاز.
name: android-matrix

on:
  workflow_dispatch:
  push:
    branches: [mobile-app]
    paths: ['mobile/store/matrix-trigger.txt']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: npm ci
        working-directory: mobile
        run: npm ci
      - name: build (local files)
        working-directory: mobile
        env:
          ANDROID_LOCAL: '1'
        run: |
          npm run sync
          cd android
          for i in 1 2 3; do ./gradlew --no-daemon assembleDebug && exit 0; echo "retry $i"; sleep 20; done; exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 3

  devices:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: pixel7-android15,   api: 35, profile: pixel_7 }
          - { name: small-phone-a14,    api: 34, profile: "Nexus 5X" }
          - { name: tablet-android14,   api: 34, profile: pixel_tablet }
          - { name: foldable-android15, api: 35, profile: pixel_fold }
          - { name: pixel6-android13,   api: 33, profile: pixel_6 }
          - { name: pixel8-android16,   api: 36, profile: pixel_8 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: mobile/android/app/build/outputs/apk/debug
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: mobile
          script: ./scripts/emulator-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.name }}
          path: mobile/emu-out
          retention-days: 7
      - name: publish screenshots + report to branch emu-results
        if: always()
        run: |
          [ -d mobile/emu-out ] || exit 0
          for try in 1 2 3 4 5; do
            D=$RUNNER_TEMP/emu$try; rm -rf "$D"
            git clone -q --depth 1 -b emu-results "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$D" 2>/dev/null || { mkdir -p "$D" && git -C "$D" init -q -b emu-results && git -C "$D" remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"; }
            T="$D/matrix/${{ matrix.name }}"; rm -rf "$T"; mkdir -p "$T"
            cp mobile/emu-out/*.png "$T"/ 2>/dev/null || true
            cp mobile/emu-out/report.json mobile/emu-out/device.txt mobile/emu-out/coldstart.txt mobile/emu-out/window.txt mobile/emu-out/crashes.txt mobile/emu-out/js-errors.txt mobile/emu-out/mem.txt mobile/emu-out/monkey-*.txt "$T"/ 2>/dev/null || true
            echo "${{ github.sha }} run ${{ github.run_id }}" > "$T/SOURCE.txt"
            git -C "$D" add -A matrix
            git -C "$D" -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -qm "matrix ${{ matrix.name }} run ${{ github.run_number }}" || exit 0
            git -C "$D" push -q origin HEAD:emu-results && exit 0
            sleep $((RANDOM % 8 + 3))
          done
          exit 0
