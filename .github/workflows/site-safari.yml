# فحص الموقع على محرك آبل الحقيقي قبل أي تنزيل (طلب المالك ١٥ نوفمبر ٢٠٢٦: «حلها من جذورها»).
# ١) Playwright WebKit بمقاس آيفون: يقيس البنرات والرأس والتحية ويطلع ✅/❌.
# ٢) Safari الحقيقي في محاكي آيفون: صور للصفحة بعد ٤ و١٢ و٢٥ ثانية.
# الموقع المفحوص: الفرع المكتوب في tools/safari/site-ref (افتراضياً gh-pages). يشتغل مع الرفع لفرع site-safari أو يدوي.
name: site-safari
on:
  push:
    branches: [site-safari]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: site-safari
  cancel-in-progress: true
jobs:
  safari:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Site ref
        id: ref
        run: echo "ref=$(cat tools/safari/site-ref 2>/dev/null || echo gh-pages)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}
          path: site
      - name: Serve site
        run: |
          (cd site && python3 -m http.server 8765 >/dev/null 2>&1 &)
          sleep 2; curl -sf http://localhost:8765/index.html >/dev/null && echo served
      - name: WebKit checks
        continue-on-error: true
        id: wk
        run: |
          mkdir -p out && cd tools/safari && npm init -y >/dev/null && npm i -s playwright@1.49.1 >/dev/null
          npx playwright install webkit >/dev/null
          set -o pipefail; node check.mjs http://localhost:8765 ../../out 2>&1 | tee ../../out/summary.txt
      - name: Real Safari in iPhone simulator
        continue-on-error: true
        run: |
          set -x
          DEV=$(xcrun simctl list devices available -j | python3 -c "import sys,json;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "device $DEV"; xcrun simctl boot "$DEV" || true; xcrun simctl bootstatus "$DEV" -b || true
          mkdir -p out/sim
          # Safari أول مرة يتأخر: نفتحه ونستنى قبل الصور
          xcrun simctl openurl "$DEV" "http://localhost:8765/index.html?warm=1" || true; sleep 40
          xcrun simctl io "$DEV" screenshot "out/sim/warm.png" || true
          i=0
          for u in "index.html" "index.html?sky=night" "index.html?embed=1&blocks=head,featured,promos&st=47&sky=maghrib"; do
            i=$((i+1))
            xcrun simctl openurl "$DEV" "http://localhost:8765/$u" || echo "openurl failed"
            sleep 6;  xcrun simctl io "$DEV" screenshot "out/sim/u${i}_05s.png" || echo "shot failed"
            sleep 8;  xcrun simctl io "$DEV" screenshot "out/sim/u${i}_13s.png" || true
            sleep 12; xcrun simctl io "$DEV" screenshot "out/sim/u${i}_25s.png" || true
          done
          ls -la out/sim
      - name: Save results to a branch
        if: always()
        run: |
          cd out
          git init -q -b r && git add -A
          git -c user.name=site-safari -c user.email=site-safari@users.noreply.github.com commit -qm "site-safari ${{ github.run_number }}"
          git push -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/shots-site/${{ github.run_number }}
      - name: Result
        if: always()
        run: cat out/summary.txt 2>/dev/null; test "${{ steps.wk.outcome }}" = "success"
