# رفع تطبيق متاجر أحد (آيفون) لـ TestFlight. يدوي بس: Actions ← ios-testflight ← Run workflow.
# التوقيع تلقائي (Xcode ينشئ الشهادة والملف من حساب آبل باستخدام مفتاح App Store Connect API)، فما فيه شهادات بالمستودع.
# أسرار المستودع المطلوبة (Settings ← Secrets and variables ← Actions، المالك يضيفها بنفسه، ما تنحط بالمستودع):
#   ASC_KEY_ID       معرّف مفتاح App Store Connect API (Users and Access ← Integrations ← App Store Connect API، دور Admin أو App Manager)
#   ASC_ISSUER_ID    Issuer ID من نفس الصفحة
#   ASC_KEY_P8       نص ملف AuthKey_XXXX.p8 كاملاً
#   APPLE_TEAM_ID    Team ID (صفحة Membership في developer.apple.com)
name: ios-testflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check secrets
        env:
          A: ${{ secrets.ASC_KEY_ID }}
          B: ${{ secrets.ASC_ISSUER_ID }}
          C: ${{ secrets.ASC_KEY_P8 }}
          D: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for n in A B C D; do if [ -z "${!n}" ]; then echo "::error::أسرار آبل ناقصة (ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, APPLE_TEAM_ID)"; exit 1; fi; done
      - name: Select Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "::error::Xcode 26 مو موجود"; exit 1; fi
          sudo xcode-select -s "$X/Contents/Developer"; xcodebuild -version
      - name: npm ci + sync
        working-directory: mobile
        run: npm ci && npm run sync
      - name: API key file
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
          KID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$P8" > "$RUNNER_TEMP/asc/AuthKey_$KID.p8"
      - name: Archive (signed, automatic)
        working-directory: mobile/ios/App
        env:
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_$KID.p8" -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive | tail -n 200
      - name: Export + upload to TestFlight
        env:
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_$KID.p8" -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS" \
            | tail -n 200
      - name: Remove key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
