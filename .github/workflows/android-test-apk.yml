# APK تجريبي لتطبيق الزبون (يدوي فقط، دقائق البناء مدفوعة). يفتح الموقع الحي، فأي تحديث للموقع يوصل التطبيق على طول.
# ما ينشر الملف على فرع test-apk إلا بعد ما يجرّبه على محاكي أندرويد: الموقع الحي انفتح بتصميم أندرويد، وصفحة العروض بدون تداخل.
name: android-test-apk

on:
  workflow_dispatch:
  push:
    branches: [mobile-app]
    paths: ['mobile/store/test-apk-trigger.txt']   # يشتغل بس لما هالملف يتغير

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: npm ci
        working-directory: mobile
        run: npm ci
      - name: build (loads the live website)
        working-directory: mobile
        run: |
          npm run sync
          grep -q '"url": "https://1097mbnalll-ui.github.io/Super/?app=android' android/app/src/main/assets/capacitor.config.json
          cd android
          for i in 1 2 3; do ./gradlew --no-daemon assembleDebug && exit 0; echo "retry $i"; sleep 20; done; exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: customer-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  check:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: customer-apk
          path: mobile/android/app/build/outputs/apk/debug
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: run on emulator (Pixel 7, Android 15)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: mobile
          script: ./scripts/customer-check.sh
      - name: publish check screenshot to branch emu-results
        if: always()
        run: |
          [ -d mobile/cust-out ] || exit 0
          for try in 1 2 3 4 5; do
            D=$RUNNER_TEMP/emu$try; rm -rf "$D"
            git clone -q --depth 1 -b emu-results "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$D" 2>/dev/null || { mkdir -p "$D" && git -C "$D" init -q -b emu-results && git -C "$D" remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"; }
            T="$D/customer-app"; rm -rf "$T"; mkdir -p "$T"
            cp mobile/cust-out/*.png mobile/cust-out/report.json mobile/cust-out/dom.txt "$T"/ 2>/dev/null || true
            echo "${{ github.sha }} run ${{ github.run_id }}" > "$T/SOURCE.txt"
            git -C "$D" add -A customer-app
            git -C "$D" -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -qm "customer check run ${{ github.run_number }}" || exit 0
            git -C "$D" push -q origin HEAD:emu-results && exit 0
            sleep $((RANDOM % 8 + 3))
          done
          exit 0

  publish:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: customer-apk
          path: apk
      - name: publish APK to branch test-apk (direct download)
        run: |
          D=$RUNNER_TEMP/pub; rm -rf "$D"; mkdir -p "$D"; cd "$D"
          git init -q -b test-apk
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          cp "$GITHUB_WORKSPACE/apk/app-debug.apk" ohod-store-test.apk
          echo "commit ${{ github.sha }}  run ${{ github.run_id }}  (loads the live website; checked on an Android 15 emulator)" > SOURCE.txt
          git add -A && git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -qm "test APK ${{ github.run_number }}"
          git push -q -f origin HEAD:test-apk
